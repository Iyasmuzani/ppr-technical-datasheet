<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rucika TechSheet — Generate professional technical datasheets for PPR pipes and fittings with automated PDF export.">
  <title>Rucika TechSheet — Technical Datasheet Generator</title>
  <link rel="stylesheet" href="css/index.css">
  <!-- pdfmake for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img src="assets/logo-rucika.png" alt="Rucika Logo" class="sidebar__logo-img" style="width:40px; height:auto; border-radius:6px;">
        <div class="sidebar__title">
          Rucika
          <span>TechSheet</span>
        </div>
      </div>

      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Main Menu</div>
        <div class="nav-item active" data-route="/" onclick="location.hash='/'">
          <span class="nav-item__icon">📊</span>
          <span class="nav-item__label">Dashboard</span>
        </div>
        <div class="nav-item" data-route="/products" onclick="location.hash='/products'">
          <span class="nav-item__icon">📦</span>
          <span class="nav-item__label">Products</span>
        </div>
        <div class="nav-item" data-route="/create" onclick="location.hash='/create'">
          <span class="nav-item__icon">📄</span>
          <span class="nav-item__label">Create Datasheet</span>
        </div>

        <div class="sidebar__section-label" style="margin-top: var(--space-md);">Management</div>
        <div class="nav-item" data-route="/history" onclick="location.hash='/history'">
          <span class="nav-item__icon">🕒</span>
          <span class="nav-item__label">History</span>
        </div>
        <div class="nav-item" data-route="/settings" onclick="location.hash='/settings'">
          <span class="nav-item__icon">⚙️</span>
          <span class="nav-item__label">Settings</span>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__user">
          <div class="sidebar__avatar">A</div>
          <div class="sidebar__user-info">
            <div class="sidebar__user-name">Administrator</div>
            <div class="sidebar__user-role">Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main">
      <header class="header">
        <button class="btn-icon" id="sidebar-toggle" style="display:none;">☰</button>
        <div class="header__search">
          <span class="header__search-icon">🔍</span>
          <input type="text" class="header__search-input" placeholder="Search documents, products...">
        </div>
        <div class="header__actions">
          <a href="#/create" class="btn btn-primary btn-sm">＋ New Datasheet</a>
        </div>
      </header>

      <div class="page-content" id="page-content">
        <!-- Page content rendered by router -->
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>

  <style>
    /* Mobile sidebar toggle visibility */
    @media (max-width: 1024px) {
      #sidebar-toggle { display: flex !important; }
    }
  </style>
</body>
</html>
